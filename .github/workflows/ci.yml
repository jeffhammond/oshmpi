name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.cc }} ${{ matrix.mpi }} direct=${{ matrix.direct }}
    runs-on: ${{ matrix.os }}
    # Only Linux + GCC + MPICH is required to pass; the other combinations are
    # tracked but allowed to fail.
    continue-on-error: ${{ !(matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc' && matrix.mpi == 'mpich') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        mpi: [mpich, openmpi]
        # OSHMPI_DIRECT: "auto" detects direct heap access at run time; "off" forces MPI RMA
        direct: [auto, off]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y autoconf automake libtool m4 ${{ matrix.cc == 'clang' && 'clang' || '' }}
          if [ "${{ matrix.mpi }}" = mpich ]; then
            sudo apt-get install -y mpich libmpich-dev
          else
            sudo apt-get install -y openmpi-bin libopenmpi-dev
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool ${{ matrix.mpi == 'mpich' && 'mpich' || 'open-mpi' }}

      - name: Show MPI
        run: |
          if [ "${{ matrix.mpi }}" = mpich ]; then mpichversion || true; mpicc -show; else mpicc --showme:command; fi

      - name: Configure and build
        env:
          # make the MPI compiler wrapper use the requested C compiler
          MPICH_CC: ${{ matrix.cc }}
          OMPI_CC: ${{ matrix.cc }}
        run: |
          ./autogen.sh
          ./configure CC=mpicc CFLAGS="-g -std=gnu11" --enable-g --disable-static
          make -j2

      - name: Test
        env:
          SHMEM_SYMMETRIC_HEAP_SIZE: 100M
          OSHMPI_DIRECT: ${{ matrix.direct == 'off' && '0' || '' }}
          # see https://github.com/open-mpi/ompi/issues/2956
          TMPDIR: /tmp
          # Open MPI refuses to run as root or oversubscribe by default
          OMPI_MCA_rmaps_base_oversubscribe: "1"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: make check

      - name: Show logs on failure
        if: failure()
        run: |
          cat config.log || true
          cat test-suite.log || true
          find . -name "*.log" -exec head -n 100 {} ";"
